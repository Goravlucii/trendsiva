<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trendsiva - Digital Marketing Agency</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- React and ReactDOM CDNs -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel CDN for JSX transpilation in browser (for development/demo only) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
      /* Custom CSS for animations and fonts */
      body {
        font-family: 'Inter', sans-serif;
      }

      /* Custom Animations for Hero Section */
      @keyframes fade-in-up {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes bounce-in {
        0% {
          opacity: 0;
          transform: scale(0.3);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
        70% {
          transform: scale(0.9);
        }
        100% {
          transform: scale(1);
        }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 1;
        }
        50% {
          opacity: 0.7;
        }
      }

      .animate-fade-in-up {
        animation: fade-in-up 1s ease-out forwards;
      }
      .animate-bounce-in {
        animation: bounce-in 1s ease-out forwards;
      }
      .animate-pulse {
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      .animation-delay-500 { animation-delay: 0.5s; }
      .animation-delay-1000 { animation-delay: 1s; }
      .animation-delay-2000 { animation-delay: 2s; }
      .animation-delay-4000 { animation-delay: 4s; }

      /* Custom glow effect for hover */
      .hover\:shadow-purple-glow:hover {
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.7); /* purple-500 with opacity */
      }
      .hover\:shadow-blue-glow:hover {
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.7); /* blue-500 with opacity */
      }
    </style>
</head>
<body class="bg-gray-950">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- All React components and rendering logic go here -->
    <script type="text/babel">
        // Main App component
        const App = () => {
          const [showModal, setShowModal] = React.useState(false);
          const [modalMessage, setModalMessage] = React.useState('');

          // Function to show custom modal messages
          const showCustomModal = (message) => {
            setModalMessage(message);
            setShowModal(true);
          };

          return (
            <div className="min-h-screen bg-gray-950 text-gray-100 font-inter antialiased">
              {/* Custom Modal Component */}
              {showModal && (
                <div className="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50 p-4">
                  <div className="bg-gray-800 rounded-lg shadow-xl p-6 max-w-sm w-full border border-purple-600">
                    <h3 className="text-xl font-bold text-white mb-4">Notification</h3>
                    <p className="text-gray-200 mb-6">{modalMessage}</p>
                    <button
                      onClick={() => setShowModal(false)}
                      className="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold py-2 px-4 rounded-md transition duration-300 ease-in-out transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-opacity-75"
                    >
                      Close
                    </button>
                  </div>
                </div>
              )}

              {/* Header */}
              <header className="fixed top-0 left-0 right-0 z-40 bg-gray-950 bg-opacity-90 backdrop-blur-sm shadow-lg py-4 px-6 md:px-12">
                <nav className="container mx-auto flex justify-between items-center">
                  <a href="#" className="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-500 to-pink-500 animate-pulse">
                    Trendsiva
                  </a>
                  <div className="hidden md:flex space-x-8">
                    <NavLink href="#services">Services</NavLink>
                    <NavLink href="#portfolio">Portfolio</NavLink>
                    <NavLink href="#pricing">Pricing</NavLink>
                    <NavLink href="#contact">Contact</NavLink>
                  </div>
                  {/* Mobile Menu Button */}
                  <MobileMenu />
                </nav>
              </header>

              <main>
                {/* Hero Section */}
                <HeroSection />

                {/* Services Section */}
                <ServicesSection />

                {/* Trust Building Section */}
                <TrustBuildingSection />

                {/* Portfolio Section */}
                <PortfolioSection />

                {/* Pricing Section */}
                <PricingSection />

                {/* Contact Section */}
                <ContactSection showCustomModal={showCustomModal} />
              </main>

              {/* Footer */}
              <footer className="bg-gray-900 py-8 px-6 md:px-12 mt-20">
                <div className="container mx-auto text-center text-gray-400">
                  <p>&copy; {new Date().getFullYear()} Trendsiva. All rights reserved.</p>
                  <p className="mt-2">Designed with passion for digital growth.</p>
                </div>
              </footer>
            </div>
          );
        };

        // Navigation Link Component
        const NavLink = ({ href, children }) => (
          <a
            href={href}
            className="text-gray-300 hover:text-purple-400 transition duration-300 ease-in-out font-medium text-lg relative group"
          >
            {children}
            <span className="absolute bottom-0 left-0 w-0 h-0.5 bg-purple-500 group-hover:w-full transition-all duration-300"></span>
          </a>
        );

        // Mobile Menu Component (Placeholder for now, can be expanded)
        const MobileMenu = () => {
          const [isOpen, setIsOpen] = React.useState(false);

          return (
            <div className="md:hidden">
              <button onClick={() => setIsOpen(!isOpen)} className="text-gray-300 focus:outline-none">
                <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  {isOpen ? (
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path>
                  ) : (
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16"></path>
                  )}
                </svg>
              </button>
              {isOpen && (
                <div className="absolute top-full left-0 right-0 bg-gray-900 shadow-lg py-4 flex flex-col items-center space-y-4">
                  <NavLink href="#services">Services</NavLink>
                  <NavLink href="#portfolio">Portfolio</NavLink>
                  <NavLink href="#pricing">Pricing</NavLink>
                  <NavLink href="#contact">Contact</NavLink>
                </div>
              )}
            </div>
          );
        };

        // Hero Section Component
        const HeroSection = () => {
          // State to track window width for responsive video
          const [windowWidth, setWindowWidth] = React.useState(window.innerWidth);

          React.useEffect(() => {
            const handleResize = () => {
              setWindowWidth(window.innerWidth);
            };

            window.addEventListener('resize', handleResize);
            return () => window.removeEventListener('resize', handleResize);
          }, []);

          // Define video URLs
          // Replace these with your actual video URLs for desktop and mobile
          const desktopVideoUrl = "material/bg_1.mp4";
          const mobileVideoUrl = "material/bg_mobile.mp4"; // Example mobile-optimized video

          return (
            <section id="hero" className="relative h-screen flex items-center justify-center text-center overflow-hidden bg-gradient-to-br from-gray-950 to-black p-6 md:p-12">
              {/* Video Background - Conditional Rendering */}
              {windowWidth >= 768 ? ( // md breakpoint is 768px in Tailwind
                <video
                  className="absolute inset-0 w-full h-full object-cover z-0 opacity-20 hidden md:block"
                  autoPlay
                  loop
                  muted
                  playsInline
                >
                  <source src={desktopVideoUrl} type="video/mp4" />
                  Your browser does not support the video tag.
                </video>
              ) : (
                <video
                  className="absolute inset-0 w-full h-full object-cover z-0 opacity-20 md:hidden"
                  autoPlay
                  loop
                  muted
                  playsInline
                >
                  <source src={mobileVideoUrl} type="video/mp4" />
                  Your browser does not support the video tag.
                </video>
              )}

              <div className="relative z-10 max-w-4xl mx-auto">
                <h1 className="text-5xl md:text-7xl font-extrabold leading-tight mb-6 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 animate-fade-in-up">
                  Trendsiva <br/> Your Digital Growth Partner
                </h1>
                <p className="text-lg md:text-2xl text-gray-300 mb-10 animate-fade-in-up animation-delay-500">
                  Unlock unparalleled online success with cutting-edge Social Media Management,
                  Lead Generation, and high-impact Meta & Google Ads.
                </p>
                <a
                  href="#contact"
                  className="inline-block bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-4 px-10 rounded-full shadow-lg transform transition-all duration-300 ease-in-out hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-500 focus:ring-opacity-75 animate-bounce-in animation-delay-1000"
                >
                  Get a Free Consultation
                </a>
              </div>
            </section>
          );
        };

        // Services Section Component
        const ServicesSection = () => (
          <section id="services" className="py-20 px-6 md:px-12 bg-gray-900">
            <div className="container mx-auto text-center">
              <h2 className="text-4xl md:text-5xl font-bold mb-12 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400">
                Our Core Services
              </h2>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                <ServiceCard
                  icon="M17 20h-4a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v11a2 2 0 01-2 2zM12 18H8a2 2 0 01-2-2V7a2 2 0 012-2h4a2 2 0 012 2v11a2 2 0 01-2 2z"
                  title="Social Media Management"
                  description="Crafting engaging content and strategies to grow your brand's presence and foster community on all major platforms."
                />
                <ServiceCard
                  icon="M13 10V3L4 14h7v7l9-11h-7z"
                  title="Lead Generation Campaigns"
                  description="Implementing targeted campaigns to capture high-quality leads, nurturing them into loyal customers for your business."
                />
                <ServiceCard
                  icon="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10a2 2 0 01-2 2h-2a2 2 0 01-2-2zm9 0V5a2 2 0 00-2-2h-2a2 2 0 00-2 2v14a2 2 0 002 2h2a2 2 0 002-2z"
                  title="Meta & Google Ads"
                  description="Maximizing your ROI with expertly managed ad campaigns on Facebook, Instagram, and Google, delivering results at the lowest cost."
                />
              </div>
            </div>
          </section>
        );

        // Service Card Component
        const ServiceCard = ({ icon, title, description }) => (
          <div className="bg-gray-800 p-8 rounded-xl shadow-xl border border-purple-700 transform transition-all duration-500 ease-in-out hover:scale-105 hover:shadow-purple-glow">
            <div className="text-purple-400 mb-6 mx-auto w-20 h-20 flex items-center justify-center rounded-full bg-purple-900 bg-opacity-30">
              <svg className="w-10 h-10" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d={icon} />
              </svg>
            </div>
            <h3 className="text-2xl font-bold text-white mb-4">{title}</h3>
            <p className="text-gray-300 leading-relaxed">{description}</p>
          </div>
        );

        // Trust Building Section Component
        const TrustBuildingSection = () => (
          <section id="trust" className="py-20 px-6 md:px-12 bg-gray-950">
            <div className="container mx-auto text-center">
              <h2 className="text-4xl md:text-5xl font-bold mb-12 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-blue-400">
                Why Choose Trendsiva?
              </h2>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <TrustBenefit
                  icon="M5 13l4 4L19 7"
                  title="Unbeatable Value"
                  description="Starting from just $300/month, get premium digital marketing without breaking the bank."
                />
                <TrustBenefit
                  icon="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
                  title="Proven Results"
                  description="Our data-driven strategies consistently deliver measurable growth and high ROI for our clients."
                />
                <TrustBenefit
                  icon="M18 10a6 6 0 10-12 0v2H4a2 2 0 00-2 2v3a2 2 0 002 2h16a2 2 0 002-2v-3a2 2 0 00-2-2h-2v-2z"
                  title="Dedicated Support"
                  description="Receive personalized attention and transparent communication every step of the way."
                />
                <TrustBenefit
                  icon="M3 6l9 4 9-4M21 14l-9 4-9-4M3 10v4l9 4 9-4v-4"
                  title="Transparent Reporting"
                  description="Access clear, concise reports showing your campaign performance and progress."
                />
              </div>
              {/* Placeholder for Client Logos/Testimonials */}
              <div className="mt-20">
                <h3 className="text-3xl font-bold text-gray-200 mb-8">Trusted by Growing Businesses</h3>
                <div className="flex justify-center items-center gap-8 opacity-70 overflow-x-auto py-4"> {/* Added overflow-x-auto and py-4 */}
                  {/* Placeholder Logos - Fixed size and in one line */}
                  <img src="material/logo_1.png" alt="Client A Logo" className="w-24 h-12 flex-shrink-0 filter grayscale hover:grayscale-0 transition-all duration-300 rounded-md" />
                  <img src="material/logo_2.png" alt="Client B Logo" className="w-24 h-12 flex-shrink-0 filter grayscale hover:grayscale-0 transition-all duration-300 rounded-md" />
                  <img src="material/logo_3.png" alt="Client C Logo" className="w-24 h-12 flex-shrink-0 filter grayscale hover:grayscale-0 transition-all duration-300 rounded-md" />
                  <img src="material/logo_1.png" alt="Client D Logo" className="w-24 h-12 flex-shrink-0 filter grayscale hover:grayscale-0 transition-all duration-300 rounded-md" />
                  <img src="material/logo_2.png" alt="Client E Logo" className="w-24 h-12 flex-shrink-0 filter grayscale hover:grayscale-0 transition-all duration-300 rounded-md" />
                  <img src="material/logo_3.png" alt="Client F Logo" className="w-24 h-12 flex-shrink-0 filter grayscale hover:grayscale-0 transition-all duration-300 rounded-md" />
                </div>
              </div>
            </div>
          </section>
        );

        // Trust Benefit Card Component
        const TrustBenefit = ({ icon, title, description }) => (
          <div className="bg-gray-800 p-6 rounded-xl shadow-lg border border-blue-700 transform transition-all duration-500 ease-in-out hover:scale-105 hover:shadow-blue-glow">
            <div className="text-blue-400 mb-4 mx-auto w-16 h-16 flex items-center justify-center rounded-full bg-blue-900 bg-opacity-30">
              <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={icon} />
              </svg>
            </div>
            <h3 className="text-xl font-bold text-white mb-3">{title}</h3>
            <p className="text-gray-300 text-sm">{description}</p>
          </div>
        );

        // Portfolio Section Component
        const PortfolioSection = () => {
          const projects = [
            {
              id: 1,
              title: "E-commerce Sales Boost",
              description: "Increased online store revenue by 40% through targeted Meta Ads and engaging social media campaigns.",
              image: "https://placehold.co/400x300/4A00B0/FFFFFF?text=E-commerce+Project",
              category: "Meta Ads"
            },
            {
              id: 2,
              title: "Local Business Lead Growth",
              description: "Generated 150+ high-quality leads monthly for a local service business via Google Search Ads.",
              image: "https://placehold.co/400x300/B0004A/FFFFFF?text=Local+Leads+Project",
              category: "Google Ads"
            },
            {
              id: 3,
              title: "Brand Awareness Campaign",
              description: "Achieved 2M+ impressions and 30% increase in brand mentions for a new startup on social media.",
              image: "https://placehold.co/400x300/004AB0/FFFFFF?text=Brand+Awareness+Project",
              category: "Social Media"
            },
            {
              id: 4,
              title: "SaaS Lead Nurturing",
              description: "Developed a comprehensive lead nurturing funnel that converted 25% of MQLs into paying customers.",
              image: "https://placehold.co/400x300/4AB000/FFFFFF?text=SaaS+Project",
              category: "Lead Generation"
            }
          ];

          const [activeCategory, setActiveCategory] = React.useState('All');

          const filteredProjects = activeCategory === 'All'
            ? projects
            : projects.filter(project => project.category === activeCategory);

          return (
            <section id="portfolio" className="py-20 px-6 md:px-12 bg-gray-900">
              <div className="container mx-auto text-center">
                <h2 className="text-4xl md:text-5xl font-bold mb-12 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400">
                  Our Success Stories
                </h2>

                <div className="flex flex-wrap justify-center gap-4 mb-12">
                  {['All', 'Social Media', 'Lead Generation', 'Meta Ads', 'Google Ads'].map(category => (
                    <button
                      key={category}
                      onClick={() => setActiveCategory(category)}
                      className={`py-2 px-6 rounded-full font-semibold transition duration-300 ease-in-out
                        ${activeCategory === category
                          ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white shadow-lg'
                          : 'bg-gray-700 text-gray-300 hover:bg-gray-600 hover:text-white'
                        }`}
                    >
                      {category}
                    </button>
                  ))}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                  {filteredProjects.map(project => (
                    <PortfolioCard key={project.id} project={project} />
                  ))}
                  {filteredProjects.length === 0 && (
                    <p className="text-gray-400 text-lg col-span-full">No projects found for this category.</p>
                  )}
                </div>
              </div>
            </section>
          );
        };

        // Portfolio Card Component
        const PortfolioCard = ({ project }) => (
          <div className="bg-gray-800 rounded-xl shadow-xl overflow-hidden border border-purple-800 transform transition-all duration-500 ease-in-out hover:scale-105 hover:shadow-2xl hover:shadow-purple-900">
            <img
              src={project.image}
              alt={project.title}
              className="w-full h-56 object-cover object-center transform transition-transform duration-500 hover:scale-110"
              onError={(e) => { e.target.onerror = null; e.target.src = `https://placehold.co/400x300/333/FFF?text=${project.title.replace(/\s/g, '+')}`; }}
            />
            <div className="p-6">
              <h3 className="text-2xl font-bold text-white mb-3">{project.title}</h3>
              <p className="text-gray-300 text-base mb-4">{project.description}</p>
              <span className="inline-block bg-purple-700 text-white text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wide">
                {project.category}
              </span>
            </div>
          </div>
        );

        // Pricing Section Component
        const PricingSection = () => (
          <section id="pricing" className="py-20 px-6 md:px-12 bg-gray-950">
            <div className="container mx-auto text-center">
              <h2 className="text-4xl md:text-5xl font-bold mb-12 text-transparent bg-clip-text bg-gradient-to-r from-pink-400 to-purple-400">
                Flexible Pricing for Every Business
              </h2>
              <p className="text-lg text-gray-300 mb-16">
                Our transparent pricing ensures you get maximum value for your investment.
                All plans are fully customizable.
              </p>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-10 max-w-6xl mx-auto">
                <PricingCard
                  plan="Starter"
                  price="300"
                  features={[
                    "Basic Social Media Management",
                    "1 Platform (e.g., Facebook)",
                    "4 Posts/Month",
                    "Basic Ad Campaign Setup (1 platform)",
                    "Monthly Performance Report"
                  ]}
                  buttonText="Get Started"
                  isFeatured={false}
                />
                <PricingCard
                  plan="Growth"
                  price="750"
                  features={[
                    "Advanced Social Media Management",
                    "2 Platforms (e.g., FB, IG)",
                    "8 Posts/Month + Stories",
                    "Optimized Lead Generation Funnel",
                    "Meta & Google Ads Management",
                    "Bi-Weekly Performance Calls",
                    "A/B Testing"
                  ]}
                  buttonText="Most Popular"
                  isFeatured={true}
                />
                <PricingCard
                  plan="Enterprise"
                  price="Custom"
                  features={[
                    "Full-Service Digital Marketing",
                    "All Major Platforms",
                    "Unlimited Content Creation",
                    "Dedicated Lead Nurturing",
                    "Comprehensive Ad Strategy & Scaling",
                    "Weekly Strategy Sessions",
                    "Custom Reporting & Analytics"
                  ]}
                  buttonText="Contact for Quote"
                  isFeatured={false}
                />
              </div>
              <p className="text-gray-400 text-md mt-10">
                *All prices are in USD. Custom plans available upon request.
              </p>
            </div>
          </section>
        );

        // Pricing Card Component
        const PricingCard = ({ plan, price, features, buttonText, isFeatured }) => (
          <div className={`bg-gray-800 rounded-xl shadow-2xl p-8 flex flex-col justify-between border-2 ${isFeatured ? 'border-purple-600 transform scale-105' : 'border-gray-700'} transition-all duration-500 ease-in-out hover:scale-105 hover:shadow-purple-glow`}>
            <div>
              <h3 className="text-3xl font-bold text-white mb-4">{plan}</h3>
              <p className="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-400 mb-6">
                {price === "Custom" ? price : `$${price}`}
                {price !== "Custom" && <span className="text-xl text-gray-400">/month</span>}
              </p>
              <ul className="text-gray-300 text-left space-y-3 mb-8">
                {features.map((feature, index) => (
                  <li key={index} className="flex items-center">
                    <svg className="w-5 h-5 text-green-400 mr-3 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    {feature}
                  </li>
                ))}
              </ul>
            </div>
            <a
              href={price === "Custom" ? "#contact" : "#contact"}
              className={`block w-full text-center py-3 px-6 rounded-full font-bold text-lg transform transition-all duration-300 ease-in-out hover:scale-105 focus:outline-none focus:ring-4 ${isFeatured
                ? 'bg-gradient-to-r from-purple-600 to-pink-600 text-white hover:from-purple-700 hover:to-pink-700 focus:ring-purple-500 focus:ring-opacity-75'
                : 'bg-gray-700 text-gray-200 hover:bg-gray-600 focus:ring-gray-500 focus:ring-opacity-75'
              }`}
            >
              {buttonText}
            </a>
          </div>
        );

        // Contact Section Component
        const ContactSection = ({ showCustomModal }) => {
          const [formData, setFormData] = React.useState({
            name: '',
            email: '',
            service: '',
            message: ''
          });

          const handleChange = (e) => {
            const { name, value } = e.target;
            setFormData(prevState => ({
              ...prevState,
              [name]: value
            }));
          };

          const handleSubmit = (e) => {
            e.preventDefault();
            // Basic validation
            if (!formData.name || !formData.email || !formData.message) {
              showCustomModal("Please fill in all required fields.");
              return;
            }
            if (!/\S+@\S+\.\S+/.test(formData.email)) {
              showCustomModal("Please enter a valid email address.");
              return;
            }

            // In a real application, you would send this data to a backend server.
            // For this example, we'll just log it and show a success message.
            console.log("Form Data Submitted:", formData);
            showCustomModal("Thank you for your message! We will get back to you shortly.");
            setFormData({ name: '', email: '', service: '', message: '' }); // Clear form
          };

          return (
            <section id="contact" className="py-20 px-6 md:px-12 bg-gray-900">
              <div className="container mx-auto text-center">
                <h2 className="text-4xl md:text-5xl font-bold mb-12 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-pink-400">
                  Let's Grow Your Business
                </h2>
                <p className="text-lg text-gray-300 mb-10 max-w-2xl mx-auto">
                  Ready to elevate your digital presence? Fill out the form below or reach out directly.
                </p>

                <div className="max-w-3xl mx-auto bg-gray-800 rounded-xl shadow-2xl p-8 md:p-10 border border-blue-700">
                  <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <InputField
                      label="Your Name"
                      type="text"
                      name="name"
                      value={formData.name}
                      onChange={handleChange}
                      placeholder="John Doe"
                      required
                    />
                    <InputField
                      label="Your Email"
                      type="email"
                      name="email"
                      value={formData.email}
                      onChange={handleChange}
                      placeholder="john.doe@example.com"
                      required
                    />
                    <div className="md:col-span-2">
                      <label htmlFor="service" className="block text-gray-300 text-sm font-bold mb-2 text-left">
                        Interested Service
                      </label>
                      <select
                        id="service"
                        name="service"
                        value={formData.service}
                        onChange={handleChange}
                        className="shadow appearance-none border border-gray-700 rounded-md w-full py-3 px-4 text-gray-200 leading-tight focus:outline-none focus:ring-2 focus:ring-purple-500 bg-gray-700 placeholder-gray-400 transition duration-300"
                      >
                        <option value="">Select a Service</option>
                        <option value="Social Media Management">Social Media Management</option>
                        <option value="Lead Generation">Lead Generation Campaigns</option>
                        <option value="Meta & Google Ads">Meta & Google Ads</option>
                        <option value="Custom Plan">Custom Plan / Other</option>
                      </select>
                    </div>
                    <div className="md:col-span-2">
                      <label htmlFor="message" className="block text-gray-300 text-sm font-bold mb-2 text-left">
                        Your Message
                      </label>
                      <textarea
                        id="message"
                        name="message"
                        rows="5"
                        value={formData.message}
                        onChange={handleChange}
                        placeholder="Tell us about your business goals and how we can help..."
                        className="shadow appearance-none border border-gray-700 rounded-md w-full py-3 px-4 text-gray-200 leading-tight focus:outline-none focus:ring-2 focus:ring-purple-500 bg-gray-700 placeholder-gray-400 transition duration-300 resize-y"
                        required
                      ></textarea>
                    </div>
                    <div className="md:col-span-2 text-center">
                      <button
                        type="submit"
                        className="bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform transition-all duration-300 ease-in-out hover:scale-105 focus:outline-none focus:ring-4 focus:ring-purple-500 focus:ring-opacity-75"
                      >
                        Send Message
                      </button>
                    </div>
                  </form>
                  <div className="mt-10 text-center text-gray-400">
                    <p className="mb-2">Or reach us directly:</p>
                    <p className="text-lg font-semibold text-white">
                      Email: <a href="mailto:info@trendsiva.com" className="text-purple-400 hover:underline">info@trendsiva.com</a>
                    </p>
                    <p className="text-lg font-semibold text-white">
                      Phone: <a href="tel:+15551234567" className="text-purple-400 hover:underline">+1 (555) 123-4567</a>
                    </p>
                  </div>
                </div>
              </div>
            </section>
          );
        };

        // Input Field Component for reusability
        const InputField = ({ label, type, name, value, onChange, placeholder, required }) => (
          <div>
            <label htmlFor={name} className="block text-gray-300 text-sm font-bold mb-2 text-left">
              {label}
            </label>
            <input
              type={type}
              id={name}
              name={name}
              value={value}
              onChange={onChange}
              placeholder={placeholder}
              className="shadow appearance-none border border-gray-700 rounded-md w-full py-3 px-4 text-gray-200 leading-tight focus:outline-none focus:ring-2 focus:ring-purple-500 bg-gray-700 placeholder-gray-400 transition duration-300"
              required={required}
            />
          </div>
        );

        // Render the App component into the 'root' div
        // Use ReactDOM.createRoot for React 18+
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
